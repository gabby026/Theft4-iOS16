name: iOS 16 compatibility build

on:
  push:
    branches: [ios16-compat]
    paths:
      - 'ios/**'
      - 'tools/**'
      - 'glue/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'toolchains/**'
      - '.github/workflows/build-ios16.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 16.3 ARM64 unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout only the iOS source tree
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CMakeLists.txt
            /CMakePresets.json
            /.gitmodules
            /cmake/**
            /toolchains/**
            /glue/**
            /ios/**
            /tests/ios/**
            /thirdparty/**
            /third_party/**
            /tools/setup_repo.py
            /tools/build_ios_release.sh
            /tools/theft4_renderer_build_args.sh
            /tools/package_ios_ipa.sh
            /tools/XenosRecomp/**

      - name: Initialize only iOS build dependencies
        shell: bash
        run: |
          sdk_modules=()
          while IFS= read -r module_path; do
            sdk_modules+=( "$module_path" )
          done < <(
            git config -f .gitmodules --get-regexp '^submodule\\..*\\.path$' |
              awk '$2 ~ /^glue\\/rexglue-sdk-main\\/thirdparty\\// { print $2 }'
          )
          if (( ${#sdk_modules[@]} > 0 )); then
            git submodule update --init --depth=1 --jobs "$(sysctl -n hw.ncpu)" --recursive -- "${sdk_modules[@]}"
          fi
          git submodule update --init --depth=1 --jobs "$(sysctl -n hw.ncpu)" --recursive -- \
            tools/XenosRecomp thirdparty/msdf-atlas-gen \
            thirdparty/MoltenVK/MoltenVK thirdparty/MoltenVK/SPIRV-Cross \
            thirdparty/json
          python3 tools/setup_repo.py --prepare-only

      - name: Checkout XeniOS source
        uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: xenios
          path: XeniOS
          submodules: false
          fetch-depth: 1

      - name: Initialize XeniOS build dependencies
        shell: bash
        run: |
          git -C XeniOS submodule sync --recursive
          git -C XeniOS submodule update --init --depth=1 --jobs "$(sysctl -n hw.ncpu)" --recursive

      - name: Set XeniOS deployment minimum to iOS 16.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("XeniOS/CMakeLists.txt")
          source = path.read_text()
          source = source.replace(
              'set(CMAKE_OSX_DEPLOYMENT_TARGET "26.0" CACHE STRING "Minimum iOS version")',
              'set(CMAKE_OSX_DEPLOYMENT_TARGET "16.3" CACHE STRING "Minimum iOS version")',
          )
          source = source.replace(
              'if(CMAKE_OSX_DEPLOYMENT_TARGET VERSION_LESS 26.0)',
              'if(CMAKE_OSX_DEPLOYMENT_TARGET VERSION_LESS 16.3)',
          )
          if "26.0" in source:
              raise SystemExit("XeniOS still contains an iOS 26 deployment floor")
          path.write_text(source)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake ninja pkg-config llvm openssl@3 vulkan-loader

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Build iPhoneOS MoltenVK archives
        run: |
          cmake -S XeniOS -B XeniOS/build-ios-xcode -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 \
            -DXENIA_ENABLE_IOS_MOLTENVK=ON
          cmake --build XeniOS/build-ios-xcode --config Release \
            --target MoltenVK MoltenVK_Common MoltenVK_ShaderConverter \
                     spirv-cross SPIRV-Tools-static --parallel 6

      - name: Build and package unsigned IPA for iOS 16.3+
        env:
          THEFT4_RENDERER: vulkan
          THEFT4_LAB_BUILD: 'OFF'
          THEFT4_MOLTENVK_IOS_LIB_DIR: ${{ github.workspace }}/XeniOS/build-ios-xcode/obj/iOS/Release
          THEFT4_BUILD_JOBS: '6'
        run: |
          ./tools/build_ios_release.sh 0.3.2

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-iOS16-unsigned-${{ github.sha }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
