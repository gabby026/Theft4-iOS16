name: iOS 16 compatibility build

on:
  push:
    branches: [ios16-compat]
    paths:
      - 'ios/**'
      - 'tools/**'
      - 'glue/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'toolchains/**'
      - '.github/workflows/build-ios16.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 16.3 ARM64 unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout Theft4
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Checkout XeniOS dependency
        uses: actions/checkout@v4
        with:
          repository: xenios-jp/XeniOS
          ref: xenios
          path: XeniOS
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install cmake ninja pkg-config llvm openssl@3 vulkan-loader

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Build iPhoneOS MoltenVK archives
        run: |
          cmake -S XeniOS -B XeniOS/build-ios-xcode -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXENIA_ENABLE_IOS_MOLTENVK=ON
          cmake --build XeniOS/build-ios-xcode --config Release \
            --target MoltenVK MoltenVK_Common MoltenVK_ShaderConverter \
                     spirv-cross SPIRV-Tools-static --parallel 6

      - name: Build and package unsigned IPA for iOS 16.3+
        env:
          THEFT4_RENDERER: vulkan
          THEFT4_MOLTENVK_IOS_LIB_DIR: ${{ github.workspace }}/XeniOS/build-ios-xcode/obj/iOS/Release
          THEFT4_BUILD_JOBS: '6'
        run: |
          ./tools/build_ios_release.sh 0.3.2

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-iOS16-unsigned-${{ github.sha }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
